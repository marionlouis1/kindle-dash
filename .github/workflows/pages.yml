# Renders the dashboard image on a schedule and publishes it as a static file
# on GitHub Pages, where the Kindle fetches it.
name: Publish dashboard

on:
  # GitHub's scheduler turned out to start only a couple of runs a day for this
  # repo, so the workflow keeps itself going instead: the "next" job below
  # waits, then starts the following run. This hourly schedule is only a safety
  # net that restarts the chain if it ever breaks.
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [lib/**, scripts/**, package-lock.json, .github/workflows/pages.yml]

permissions:
  contents: read
  actions: write # for the keep-alive step at the end
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # If the weather service is down this step fails and the previous image
      # stays online.
      - run: npm run render
        env:
          OPEN_METEO_BASE: https://kindle-dash-nu.vercel.app/open-meteo
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
      # GitHub switches off scheduled workflows in public repos after 60 days
      # without a commit. Re-enabling the workflow through the API resets that
      # clock, so the schedule keeps running without anyone touching the repo.
      - name: Keep the schedule alive
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/pages.yml/enable"

  # Starts the following run after a pause. Runs even when publishing failed
  # (weather service down), so one bad run does not stop the updates.
  next:
    needs: publish
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Wait
        run: |
          # The Kindle fetches every 30 minutes; a new image every 15 keeps it
          # fresh. At night (23:00-07:00 in Paris) one an hour is plenty.
          hour=$(TZ=Europe/Paris date +%-H)
          if [ "$hour" -ge 23 ] || [ "$hour" -lt 7 ]; then
            sleep 3300
          else
            sleep 780
          fi
      - name: Start the next run
        run: |
          # Only the newest run carries the chain on. If a later run (a push,
          # the hourly schedule) is already going, it will do it, and this one
          # stops; otherwise the chains would multiply.
          newer=$(gh run list --workflow pages.yml --limit 20 --json number,status \
            --jq "[.[] | select(.number > ${{ github.run_number }} and .status != \"completed\")] | length")
          if [ "$newer" -gt 0 ]; then
            echo "A newer run is active; leaving the chain to it."
          else
            gh workflow run pages.yml --ref main
          fi
