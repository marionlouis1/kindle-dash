# Renders the dashboard image on a schedule and publishes it as a static file
# on GitHub Pages, where the Kindle fetches it.
name: Publish dashboard

on:
  schedule:
    # Every 10 minutes, away from the top of the hour where GitHub's scheduler
    # is busiest. GitHub starts scheduled runs late and sometimes skips them,
    # so this asks more often than the Kindle fetches (every 30 minutes).
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [lib/**, scripts/**, package-lock.json, .github/workflows/pages.yml]

permissions:
  contents: read
  actions: write # for the keep-alive step at the end
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # If the weather service is down this step fails and the previous image
      # stays online.
      - run: npm run render
        env:
          OPEN_METEO_BASE: https://kindle-dash-nu.vercel.app/open-meteo
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
      # GitHub switches off scheduled workflows in public repos after 60 days
      # without a commit. Re-enabling the workflow through the API resets that
      # clock, so the schedule keeps running without anyone touching the repo.
      - name: Keep the schedule alive
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/pages.yml/enable"
